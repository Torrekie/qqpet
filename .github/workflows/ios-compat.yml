name: iOS shared compatibility

on:
  push:
    branches: ['**']
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'vite*.config.ts'
      - 'electron.vite.config.ts'
      - 'tsconfig*.json'
      - 'package*.json'
      - 'ios/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'vite*.config.ts'
      - 'electron.vite.config.ts'
      - 'tsconfig*.json'
      - 'package*.json'
      - 'ios/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruffle:
    uses: ./.github/workflows/ruffle-runtime.yml

  web:
    needs: ruffle
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NODE_OPTIONS: --max-old-space-size=1024
      QQPET_RUFFLE_BUNDLE: out/ruffle-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: ruffle-runtime
          path: out/ruffle-runtime
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:compat
      - run: npm run build:ios-web
      - run: npm run build:android-web
      - run: npm run build:harmony-web
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: qqpet-ios-web
          path: out/ios
          if-no-files-found: error

  native:
    needs: web
    uses: ./.github/workflows/ios-build.yml
